name: snyk scaning
on: workflow_dispatch
jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
        - name: get code
          uses: actions/checkout@v6
        - name: install dependencies
          run: mvn install
        - name: compile the project
          run: mvn compile
        - name: run the main class
          run: mvn exec:java -Dexec.mainClass=Unzipper
        - name: run snyk
          run: snyk test --reachable
